version: "3.9"

services:
  vps-backend:
    build: .
    container_name: leilao-vps
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./leilao_vps.db:/app/leilao_vps.db  # SQLite persistente
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
